<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saxi Patel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Saxi Patel, software developer. Ride Line S: a scroll-driven transit map of my career, projects and stack.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Concept: the whole portfolio is a transit map. Scrolling drives a train along Line S (career);
   the camera follows it, each station opens a card, project lines branch off with feature stations,
   the line bridges the Atlantic (Gujarat -> New Jersey), and ends at "Next stop: your team".
   Single committed dark theme: a night-time control-room map. */
:root {
  --bg: #060a12;
  --bg2: #0a101b;
  --panel: rgba(13, 20, 33, .9);
  --panel2: #142033;
  --line: #1e2a40;
  --fg: #eaf0f8;
  --muted: #8796ad;
  --amber: #ffb347;   /* Line S */
  --teal: #3fd6c4;    /* ReturnDesk line */
  --coral: #ff7a66;   /* FlowOps line */
  --blue: #7d93ff;    /* education stations / tech district */
  --err: #ff6b7a;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-snap-type: y proximity; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 15px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3 { margin: 0; font-family: var(--display); text-wrap: balance; }
p { margin: 0; }
.eyebrow { font: 500 11.5px/1.2 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }

/* ---------- fixed stage ---------- */
#stage { position: fixed; inset: 0; z-index: 1; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default; }
#stage::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(255,255,255,.016) 0 1px, transparent 1px 3px), radial-gradient(130% 90% at 50% 40%, transparent 55%, rgba(0,0,0,.55)); }
#track section { height: 100vh; height: 100dvh; scroll-snap-align: start; }

/* top bar */
.bar { position: fixed; z-index: 20; left: 0; right: 0; top: 0;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) 12px max(18px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 16px; pointer-events: none;
  background: linear-gradient(to bottom, var(--bg) 0%, rgba(6,10,18,.92) 55%, rgba(6,10,18,0) 100%); padding-bottom: 26px; }
.bar > * { pointer-events: auto; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 700 13px/1 var(--display); letter-spacing: .05em; }
.roundel { width: 28px; height: 28px; border-radius: 50%; border: 5px solid var(--amber); position: relative; flex: none; }
.roundel::after { content: ""; position: absolute; left: -9px; right: -9px; top: 50%; height: 6px; margin-top: -3px; background: var(--teal); border-radius: 2px; }
.readout { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font: 500 12px/1 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.readout b { color: var(--fg); font-weight: 500; }
.readout .ln { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--amber); color: #1b1203; font: 700 11px/1 var(--display); flex: none; }
.tools { margin-left: auto; display: flex; gap: 8px; }
.pill { cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 9px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font: 500 12.5px/1 var(--mono); color: var(--fg); text-decoration: none; white-space: nowrap; }
.pill:hover { border-color: var(--amber); }
.pill kbd { font: inherit; color: var(--muted); }

/* bottom HUD: the line as a progress bar */
.hud { position: fixed; z-index: 15; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 0; padding: 12px 18px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); backdrop-filter: blur(8px); }
.hud ol { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; position: relative; }
.hud ol::before { content: ""; position: absolute; left: 7px; right: 7px; top: 50%; height: 4px; margin-top: -2px; background: var(--line); border-radius: 2px; }
.hud .fill { position: absolute; left: 7px; top: 50%; height: 4px; margin-top: -2px; background: var(--amber); border-radius: 2px; width: 0; }
.hud li { position: relative; padding: 0 9px; }
.hud li:first-of-type { padding-left: 0; } .hud li:last-child { padding-right: 0; }
.hud li button { display: block; width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--muted); background: var(--bg); cursor: pointer; padding: 0; position: relative; z-index: 1; }
.hud li button.passed { border-color: var(--amber); }
.hud li button.here { border-color: var(--amber); background: var(--amber); box-shadow: 0 0 0 5px rgba(255,179,71,.2); }
.hud li button:hover::after, .hud li button:focus-visible::after { content: attr(data-name); position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); white-space: nowrap; font: 500 11px/1 var(--mono); padding: 6px 8px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); color: var(--fg); }
.clock { position: fixed; z-index: 15; left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); font: 500 12px/1.5 var(--mono); color: var(--muted); }
.clock b { color: var(--fg); font-weight: 500; }
.clock i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--teal); margin-right: 8px; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(63,214,196,.5); } 50% { box-shadow: 0 0 0 7px rgba(63,214,196,0); } }
#mini { position: fixed; z-index: 15; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 200px; height: 96px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }

/* station card */
#card { position: fixed; z-index: 10; right: max(22px, env(safe-area-inset-right, 0px)); top: 78px; bottom: 130px; width: min(460px, 42vw);
  display: flex; flex-direction: column; justify-content: center; pointer-events: none; transition: opacity .25s, transform .25s; }
#card .in { pointer-events: auto; max-height: 100%; overflow-y: auto; padding: 26px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); backdrop-filter: blur(10px); box-shadow: 0 30px 80px -30px rgba(0,0,0,.7); border-top: 5px solid var(--c, var(--amber)); scrollbar-width: thin; }
#card.off { opacity: 0; transform: translateX(16px); }
#card.off .in { pointer-events: none; }
.when { font: 700 12px/1 var(--mono); letter-spacing: .1em; color: var(--c); text-transform: uppercase; }
.card-h { font-size: 26px; font-weight: 700; line-height: 1.1; margin-top: 10px; }
.org { color: var(--muted); margin-top: 6px; }
.card ul { margin: 14px 0 0; padding-left: 18px; display: grid; gap: 7px; }
.card li::marker { color: var(--c); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 16px; }
.stats div { background: var(--panel2); padding: 11px; }
.stats b { display: block; font: 800 22px/1 var(--display); color: var(--c); font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
.chip { font: 500 11.5px/1 var(--mono); padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line); background: transparent; }
button.chip { cursor: pointer; }
button.chip[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #0a0f1c; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.sim { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; cursor: pointer; font: 600 13px/1 var(--body); padding: 11px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel2); transition: border-color .2s, transform .2s; }
.btn:hover { border-color: var(--c, var(--amber)); transform: translateY(-1px); }
.btn.go { background: var(--c, var(--amber)); border-color: var(--c, var(--amber)); color: #12100a; }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.log { margin-top: 12px; padding: 12px; min-height: 150px; max-height: 210px; overflow: auto; border: 1px solid var(--line); border-radius: 9px; background: #04070c; font: 400 11.5px/1.7 var(--mono); }
.log p { white-space: pre-wrap; overflow-wrap: anywhere; }
.k { color: var(--amber); } .g { color: var(--teal); } .r { color: var(--err); } .m { color: var(--muted); }
.states { display: flex; margin-top: 14px; }
.state { flex: 1; display: grid; justify-items: center; gap: 6px; position: relative; }
.state::before { content: ""; position: absolute; top: 7px; left: -50%; right: 50%; height: 3px; background: var(--line); }
.state:first-child::before { display: none; }
.state.done::before, .state.cur::before { background: var(--teal); }
.state i { width: 17px; height: 17px; border-radius: 50%; border: 4px solid var(--line); background: var(--bg2); position: relative; z-index: 1; }
.state.done i { border-color: var(--teal); background: var(--teal); }
.state.cur i { border-color: var(--teal); box-shadow: 0 0 0 5px rgba(63,214,196,.2); }
.state.rej i { border-color: var(--err); background: var(--err); }
.state span { font: 500 9.5px/1.2 var(--mono); color: var(--muted); text-align: center; }
.state.cur span, .state.done span { color: var(--fg); }
.used { list-style: none; padding: 0 !important; display: grid; gap: 7px !important; }
.used li { display: flex; gap: 10px; align-items: center; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); font-size: 14px; }
.used li i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.used li span { margin-left: auto; color: var(--muted); font-size: 12px; text-align: right; }
.term { margin-top: 14px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #04070c; }
.screen { height: 230px; overflow-y: auto; padding: 12px; font: 400 12.5px/1.65 var(--mono); }
.screen p { white-space: pre-wrap; overflow-wrap: anywhere; }
.screen .cmd::before { content: "$ "; color: var(--teal); }
.prompt { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); font: 400 13px/1 var(--mono); }
.prompt span { color: var(--teal); }
.prompt input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--fg); font: inherit; caret-color: var(--amber); }
.reach { display: grid; gap: 8px; margin-top: 16px; }
.reach > * { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel2); text-decoration: none; min-width: 0; }
.reach .eyebrow { width: 70px; flex: none; }
.reach .v { font: 500 13px/1.3 var(--mono); overflow-wrap: anywhere; min-width: 0; }
.reach button { margin-left: auto; cursor: pointer; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg2); font: 600 11.5px/1 var(--body); }

/* hero overlay (station 0) */
#hero { position: fixed; z-index: 10; left: max(28px, env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%); width: min(640px, 56vw); transition: opacity .3s, transform .3s; }
#hero.off { opacity: 0; transform: translateY(-46%); pointer-events: none; }
#hero::before { content: ""; position: absolute; inset: -140px -200px -140px -400px; z-index: -1; background: radial-gradient(closest-side, rgba(6,10,18,.92), rgba(6,10,18,0)); }
.kicker { display: flex; flex-wrap: wrap; gap: 8px; }
.kicker span { font: 500 12px/1 var(--mono); padding: 8px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--muted); }
.kicker b { color: var(--fg); font-weight: 500; }
.name { margin-top: 22px; font-weight: 800; font-size: clamp(56px, 9vw, 132px); line-height: .86; letter-spacing: -.025em; text-transform: uppercase; }
.name span { display: block; }
.name .hl { color: var(--amber); text-shadow: 0 0 50px rgba(255,179,71,.35); }
.tag { margin-top: 22px; font-size: clamp(17px, 1.6vw, 20px); color: var(--muted); max-width: 34ch; line-height: 1.5; }
.tag b { color: var(--fg); font-weight: 600; }
.board { margin-top: 26px; display: inline-flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 10px; background: #111; border: 1px solid #2a2a2a; font: 700 13px/1 var(--mono); color: var(--amber); letter-spacing: .08em; text-transform: uppercase; }
.board .blink { animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
#tip { position: fixed; z-index: 12; pointer-events: none; padding: 8px 10px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); font: 500 12px/1.4 var(--mono); max-width: 240px; transform: translate(-50%, calc(-100% - 22px)); }
#tip b { display: block; color: var(--amber); }

/* ---------- skim view ---------- */
#skim { position: relative; z-index: 30; min-height: 100vh; background: var(--bg); padding-block: 90px 60px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
#skim .w { max-width: 860px; margin: 0 auto; display: grid; gap: 34px; }
#skim h1 { font-size: clamp(36px, 6vw, 64px); text-transform: uppercase; line-height: .95; }
#skim h2 { font-size: 13px; font-family: var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--amber); font-weight: 700; margin-bottom: 12px; }
#skim h3 { font: 600 18px/1.3 var(--body); }
#skim .item { padding-block: 14px; border-top: 1px solid var(--line); }
#skim .meta { color: var(--muted); font-size: 14px; }
#skim ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 5px; }
body.skimming #stage, body.skimming #track, body.skimming .hud, body.skimming .clock, body.skimming #mini, body.skimming #card, body.skimming #hero { display: none; }
body.skimming .readout { display: none; }
html:has(body.skimming) { scroll-snap-type: none; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- phone ---------- */
@media (max-width: 820px) {
  .readout { display: none; }
  .pill.hide-s { display: none; }
  #mini, .clock { display: none; }
  .hud { bottom: auto; top: calc(60px + env(safe-area-inset-top, 0px)); padding: 9px 14px; }
  .hud li { padding: 0 6px; }
  .hud li button { width: 12px; height: 12px; }
  #card { left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: auto; top: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); height: 54vh; height: 54dvh; justify-content: flex-end; }
  #card .in { padding: 18px; }
  #card.off { transform: translateY(16px); }
  .card-h { font-size: 21px; }
  #hero { left: max(18px, env(safe-area-inset-left, 0px)); right: max(18px, env(safe-area-inset-right, 0px)); width: auto; top: auto; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: none; }
  #hero.off { transform: translateY(10px); }
  #hero::before { inset: -120px -40px -40px -40px; background: linear-gradient(to top, rgba(6,10,18,.96) 55%, rgba(6,10,18,0)); }
  .tag { font-size: 16px; }
  .board { font-size: 11px; gap: 10px; }
}
</style>

<script>
(() => {

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const C = { amber: '#ffb347', teal: '#3fd6c4', coral: '#ff7a66', blue: '#7d93ff', fg: '#eaf0f8', muted: '#8796ad', bg: '#060a12' };

  /* ================= MAP GEOMETRY (world units, octilinear like a real transit map) ================= */
  const R = [[0,0],[360,0],[520,0],[680,160],[680,360],[680,480],[800,600],[1040,600],[1240,600],[1400,440],[1400,200],[1400,80],[1480,0],[1800,0],[2000,0],[2160,160],[2160,420],[2160,560],[2300,700],[2600,700],[2800,700],[2960,540],[2960,300],[2960,160],[3100,20],[3400,20]];
  const segLen = [], cum = [0];
  for (let i = 1; i < R.length; i++) { const l = Math.hypot(R[i][0] - R[i-1][0], R[i][1] - R[i-1][1]); segLen.push(l); cum.push(cum[i-1] + l); }

  const tColors = [C.coral, C.teal, C.blue, C.blue];

  function initFlowOps() {
    const log = $('#flog'), btns = ['#fApprove', '#fAgain', '#fRace'].map(x => $(x));
    let busy = false;
    const L = (h) => { const p = document.createElement('p'); p.innerHTML = h; log.appendChild(p); log.scrollTop = log.scrollHeight; };
    const wait = (ms) => new Promise(r => setTimeout(r, reduce ? 0 : ms));
    const head = ['<span class="k">POST</span> /api/requests/1042/decision', '<span class="g">✓</span> session · CSRF · requireRole(MANAGER)', '<span class="g">✓</span> accessService: reviewer owns #1042', "<span class=\"k\">BEGIN</span>; UPDATE request SET status='APPROVED'\n  WHERE id=1042 AND status='PENDING'"];
    const win = () => { L('  <span class="g">→ 1 row</span> · INSERT task "Fulfil #1042" · <span class="k">COMMIT</span>'); L('<span class="g">200 OK</span> · approved · follow-up task created'); };
    async function run(ok, who = '') {
      for (let i = 0; i < head.length; i++) { L((who && !i ? `<span class="m">${who}</span> ` : '') + head[i]); await wait(260); }
      if (ok) win(); else { L('  <span class="r">→ 0 rows</span> · <span class="k">ROLLBACK</span>'); L('<span class="r">409 Conflict</span> · already decided'); }
    }
    async function guard(fn) { if (busy) return; busy = true; btns.forEach(b => b.disabled = true); log.innerHTML = ''; await fn(); busy = false; btns.forEach(b => { if (document.contains(b)) b.disabled = false; }); }
    btns[0].onclick = () => guard(() => run(true));
    btns[1].onclick = () => guard(() => run(false));
    btns[2].onclick = () => guard(async () => { L('<span class="m">Two managers press Approve within 5 ms…</span>'); await run(true, '[A]'); await run(false, '[B]'); L('<span class="m">Exactly one decision recorded.</span>'); });
    head.forEach(L); win();
  }

  function initReturnDesk() {

    const states = $('#rstates'), log = $('#rlog');
    let cur = 0, rej = false, clock = 0;
    const stamp = () => { clock += 9 + Math.floor(Math.random() * 30); const m = 540 + clock; return `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };
    const L = (h) => { const p = document.createElement('p'); p.innerHTML = h; log.appendChild(p); log.scrollTop = log.scrollHeight; };
    const render = () => {
      states.innerHTML = flow.map((s, i) => { let c = i < cur ? 'done' : i === cur ? 'cur' : ''; if (rej && i === cur) c = 'rej'; return `<div class="state ${c}"><i></i><span>${rej && i === cur ? 'rejected' : ({ pending_review: 'pending', under_review: 'in review' }[s] || s)}</span></div>`; }).join('');
      $('#rNext').disabled = rej || cur === flow.length - 1; $('#rReject').disabled = rej || flow[cur] !== 'under_review';
    };
    const start = () => { cur = 0; rej = false; clock = 0; log.innerHTML = ''; L(`<span class="m">${stamp()}</span> customer opened <span class="k">RD-2087</span> · return · qty 1`); L('<span class="g">✓</span> inside 30-day window · quantity returnable'); render(); };
    $('#rNext').onclick = () => { if (rej || cur >= flow.length - 1) return; const to = flow[cur + 1]; L('<span class="k">SELECT … FOR UPDATE</span> <span class="m">row locked</span>'); L(`<span class="m">${stamp()}</span> return_events <span class="k">${flow[cur]} → ${to}</span>`); if (to === 'fulfilled') L('<span class="g">refund recorded</span> (simulated)'); L(to === 'closed' ? '<span class="g">COMMIT</span> · closed · customer notified' : '<span class="g">COMMIT</span>'); cur++; render(); };
    $('#rReject').onclick = () => { if (rej || flow[cur] !== 'under_review') return; L('<span class="r">422</span> a rejection needs a reason'); L('<span class="m">reason:</span> "Damage not covered by warranty"'); L(`<span class="m">${stamp()}</span> return_events <span class="k">under_review → rejected</span> · <span class="g">COMMIT</span>`); rej = true; render(); };
    $('#rReset').onclick = start;
    start(); $('#rNext').click();
  }
